<!DOCTYPE html>
<html>
<head>
  <title>Scan Machine</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <h1>Scan a Washer or Dryer</h1>

  <div id="reader" style="width:300px"></div>
  <a href="index.html">Back to Machine List</a>

  <script>
    // When scan succeeds:
    function onScanSuccess(qrCodeText) {
      console.log("Scanned Machine: " + qrCodeText);

      // Store machine ID for dashboard to update
      localStorage.setItem("scannedMachine", qrCodeText);

      // Redirect to dashboard
      window.location.href = "index.html";
    }

    // Start scanner
    new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: 250 }
    ).render(onScanSuccess);
  </script>
</body>
</html>
